<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0d12" />
    <meta
      name="description"
      content="Heartwood: a logic tower defense game. Elves, ents and unicorns against monsters: build mazes, read the waves, pick the right defender."

    <title>Heartwood</title>
    <link rel="icon" href="./assets/mark-T557haRv.svg" type="image/svg+xml" />
    <script type="module" crossorigin src="./assets/index-BvreVe4t.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-867PVTt3.css">
  </head>
  <body>
    <div class="app" id="app">
      <header class="topbar">
        <button type="button" class="brand" id="home">
          <img src="data:image/svg+xml,%3csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%20width='32'%20height='32'%20role='img'%20aria-label='kokot.it'%3e%3ctitle%3ekokot.it%3c/title%3e%3cg%20fill='none'%20stroke='%23eceef3'%20stroke-width='2.4'%20stroke-linecap='round'%20stroke-linejoin='round'%3e%3cpath%20d='M9.5%206.5V25.5'/%3e%3cpath%20d='M9.5%2018L22.5%209'/%3e%3cpath%20d='M9.5%2018L22.5%2025.5'/%3e%3c/g%3e%3ccircle%20cx='9.5'%20cy='6.5'%20r='2.5'%20fill='%23eceef3'/%3e%3ccircle%20cx='9.5'%20cy='25.5'%20r='2.5'%20fill='%23eceef3'/%3e%3ccircle%20cx='22.5'%20cy='9'%20r='2.5'%20fill='%23eceef3'/%3e%3ccircle%20cx='22.5'%20cy='25.5'%20r='2.5'%20fill='%23eceef3'/%3e%3ccircle%20cx='9.5'%20cy='18'%20r='3.4'%20fill='%23ffb547'/%3e%3c/svg%3e" alt="" width="22" height="22" />
          <span class="brand-title">Heartwood</span>
        </button>
        <span class="level-name" id="level-name"></span>
        <span class="spacer"></span>
        <div class="stats" id="stats" hidden>
          <span class="stat stat-lives" id="stat-lives"
            ><span class="stat-label" data-i18n="lives"></span><span class="stat-value"></span
          ></span>
          <span class="stat stat-credits" id="stat-credits"
            ><span class="stat-label" data-i18n="credits"></span><span class="stat-value"></span
          ></span>
          <span class="stat stat-wave" id="stat-wave"
            ><span class="stat-label" data-i18n="wave"></span><span class="stat-value"></span
          ></span>
        </div>
        <div class="controls" id="controls" hidden>
          <button type="button" class="btn btn-ghost" id="speed"></button>
          <button type="button" class="btn btn-ghost" id="pause"></button>
          <button type="button" class="btn btn-ghost" id="restart" data-i18n="restart"></button>
        </div>
        <button type="button" class="btn btn-ghost btn-icon" id="help-open">
          <span aria-hidden="true">?</span>
        </button>
        <div class="lang-switch" role="group" id="lang-switch">
          <button type="button" data-lang="en" lang="en">EN</button>
          <button type="button" data-lang="pl" lang="pl">PL</button>
        </div>
      </header>

      <main class="screen screen-menu" id="menu">
        <section class="hero">
          <div class="hero-copy">
            <h1 data-i18n="title"></h1>
            <p class="tagline" data-i18n="tagline"></p>
            <div class="hero-actions" id="hero-actions"></div>
          </div>
          <div class="hero-scene" id="hero-scene" aria-hidden="true">
            <canvas class="showcase" id="showcase"></canvas>
          </div>
        </section>
        <section class="trail" aria-labelledby="levels-title">
          <div class="trail-head">
            <h2 id="levels-title" data-i18n="levels"></h2>
            <span class="trail-total" id="levels-total"></span>
          </div>
          <ol class="levels" id="levels"></ol>
          <div class="menu-status" id="menu-status" role="status" aria-live="polite"></div>
        </section>
        <section class="siege" id="siege" aria-labelledby="siege-title"></section>
      </main>

      <main class="screen screen-game" id="game" hidden>
        <div class="board-wrap" id="board-wrap">
          <canvas class="board" id="board" tabindex="0" role="application"></canvas>
          <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
          <div class="paused-badge" id="paused-badge" hidden></div>
        </div>
        <aside class="side" id="side">
          <div class="side-inner">
            <section class="panel panel-build">
              <h2 class="panel-title" data-i18n="build"></h2>
              <div class="palette" id="palette"></div>
            </section>
            <section class="panel panel-info" id="info"></section>
            <section class="panel panel-waves">
              <div class="wave-head">
                <h2 class="panel-title" id="wave-title"></h2>
                <button type="button" class="btn btn-primary" id="start-wave"></button>
              </div>
              <div class="wave-progress" id="wave-progress" hidden><span></span></div>
              <ul class="wave-next" id="wave-next"></ul>
              <h3 class="panel-subtitle" id="later-title" data-i18n="laterWaves"></h3>
              <ol class="wave-later" id="wave-later"></ol>
            </section>
          </div>
        </aside>
      </main>

      <div class="overlay" id="overlay" hidden>
        <div
          class="dialog"
          id="dialog"
          role="dialog"
          aria-modal="true"
          aria-labelledby="dialog-title"
        ></div>
      </div>
      <p class="visually-hidden" id="announcer" aria-live="polite"></p>
    </div>
  </body>
</html>
